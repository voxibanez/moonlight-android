name: Android Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            build.gradle
            settings.gradle
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
            app/build.gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APKs
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Missing one or more Android signing secrets"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.keystore"

      - name: Build release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload debug APKs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

      - name: Upload release APKs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-apks
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

  tag-build:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.create_tag.outputs.tag_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create build tag
        id: create_tag
        run: |
          TAG_NAME="build-${GITHUB_RUN_NUMBER}-$(git rev-parse --short=12 "$GITHUB_SHA")"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          git fetch --tags
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$GITHUB_SHA" -m "Successful Android build for $GITHUB_SHA"
          git push origin "$TAG_NAME"

  publish-release-assets:
    needs:
      - build
      - tag-build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download debug APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" -n debug-apks -D release-assets/debug

      - name: Download release APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" -n release-apks -D release-assets/release

      - name: Create or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.tag-build.outputs.tag_name }}
        shell: bash
        run: |
          mapfile -d '' APK_FILES < <(find release-assets -type f -name '*.apk' -print0)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "No APK assets were downloaded"
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${APK_FILES[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${APK_FILES[@]}" \
              --title "$TAG_NAME" \
              --notes "Automated Android build assets for $GITHUB_SHA"
          fi
